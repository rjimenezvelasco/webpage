<form #registroForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombress</label>
      <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="registro.nombre" required #nombre="ngModel">
      <div *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="text-danger">
        El nombre es requerido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="apellidos" class="form-label">Apellidos</label>
      <input type="text" class="form-control" id="apellidos" name="apellidos" [(ngModel)]="registro.apellidos" required #apellidos="ngModel">
      <div *ngIf="apellidos.invalid && (apellidos.dirty || apellidos.touched)" class="text-danger">
        Los apellidos son requeridos.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="pais" class="form-label">País</label>
      <input type="text" class="form-control" id="pais" name="pais" [(ngModel)]="registro.pais" required #pais="ngModel">
      <div *ngIf="pais.invalid && (pais.dirty || pais.touched)" class="text-danger">
        El país es requerido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono</label>
      <input type="text" class="form-control" id="telefono" name="telefono" [(ngModel)]="registro.telefono" required #telefono="ngModel">
      <div *ngIf="telefono.invalid && (telefono.dirty || telefono.touched)" class="text-danger">
        El teléfono es requerido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="codigoTelefono" class="form-label">Código de Teléfono</label>
      <input type="text" class="form-control" id="codigoTelefono" name="codigoTelefono" [(ngModel)]="registro.codigoTelefono" required #codigoTelefono="ngModel">
      <div *ngIf="codigoTelefono.invalid && (codigoTelefono.dirty || codigoTelefono.touched)" class="text-danger">
        El código de teléfono es requerido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="sexo" class="form-label">Sexo</label>
      <select class="form-select" id="sexo" name="sexo" [(ngModel)]="registro.sexo" required #sexo="ngModel">
        <option value="">Seleccione...</option>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
        <option value="otro">Otro</option>
      </select>
      <div *ngIf="sexo.invalid && (sexo.dirty || sexo.touched)" class="text-danger">
        El sexo es requerido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="email" name="email" [(ngModel)]="registro.email" required email #email="ngModel">
      <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
        El correo electrónico es inválido.
      </div>
    </div>
  
    <div class="mb-3">
      <label for="provincia" class="form-label">Provincia</label>
      <input type="text" class="form-control" id="provincia" name="provincia" [(ngModel)]="registro.provincia" required #provincia="ngModel">
      <div *ngIf="provincia.invalid && (provincia.dirty || provincia.touched)" class="text-danger">
        La provincia es requerida.
      </div>
    </div>
  
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="aceptarWhatsapp" name="aceptarWhatsapp" [(ngModel)]="registro.aceptarWhatsapp">
      <label class="form-check-label" for="aceptarWhatsapp">Aceptar envío de datos por WhatsApp</label>
    </div>
  
    <button type="submit" class="btn btn-primary" [disabled]="registroForm.invalid">Enviar</button>
  </form>
